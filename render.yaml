services:
  - type: web
    name: bharati-unique-backend-v4
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_PIN
        sync: false
      - key: DHAN_TOTP_SECRET
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: DEFAULT_INDEX
        value: NIFTY
